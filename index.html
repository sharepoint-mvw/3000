<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Changelog - MVW3000</title>
    <!-- Chamada para o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1 id="project-name">MVW3000</h1>
      <p>Current Version: v<span id="current-version"></span></p>

      <!-- Área de Login -->
      <div class="login-container" id="login-area">
        <input type="password" id="admin-pass" placeholder="Password" />
        <button onclick="checkPassword()">Login</button>
      </div>
      
      <!-- Mensagem de sucesso (oculta inicialmente) -->
      <div id="admin-msg" style="display:none; color: #81d4fa; margin-top:5px;">
        Engineering Mode Enabled
      </div>
    </header>

    <div class="container">
      <div id="validation-errors"></div>
      <div id="changelog-container"></div>
    </div>

    <!-- Chamada para o arquivo JavaScript externo -->
    <script src="script.js"></script>
  </body>
</html>
